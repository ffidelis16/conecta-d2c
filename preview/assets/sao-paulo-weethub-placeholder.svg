<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Marcação visual da edição São Paulo com Weethub</title>
  <desc id="desc">Imagem provisória para substituir por fotografia autorizada da edição.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001f3e"/>
      <stop offset="1" stop-color="#0050c3"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#8effbd" stroke-opacity=".17" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <circle cx="1260" cy="220" r="310" fill="#8effbd" fill-opacity=".13"/>
  <circle cx="220" cy="1030" r="390" fill="#fff" fill-opacity=".06"/>
  <path d="M230 780C485 510 782 560 1060 300c130-122 225-154 370-175" fill="none" stroke="#8effbd" stroke-opacity=".7" stroke-width="4"/>
  <path d="M130 180H610" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".7" stroke-width="6"/>
  <path d="M130 210H390" fill="none" stroke="#8effbd" stroke-linecap="round" stroke-width="6"/>
</svg>
